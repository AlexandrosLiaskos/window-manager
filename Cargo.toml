[package]
name = "window-manager"
version = "0.3.0"
edition = "2021"
description = "A lightweight window manager for Windows 11"
license = "MIT"
repository = "https://github.com/user/window-manager"
keywords = ["windows", "window-manager", "tiling", "productivity"]
categories = ["os::windows-apis"]

[dependencies]
# Official Microsoft Windows API bindings (low-level FFI)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"

# Lazy initialization
once_cell = "1.19"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary
strip = true        # Strip symbols

[[bin]]
name = "window-manager"
path = "src/main.rs"
